<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PYSCRIPT CDN -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- BOOTSTRAP CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <title>Cadet Officer Club Checker</title>

</head>
<body style="background-color: antiquewhite;">

    <form>

        <div class="mt-5">
            <h1 class="text-center"><b>Cadet Officer Club Checker</b></h2>
        </div>

        <div class="container mt-5 p-5 rounded-3 w-50" style="background-color: slategray; color: aliceblue;">
            

            <!-- FIRST NAME INPUT -->
            <label><b>Enter your First Name</b></label><br>
            <input type="text" id="firstname" placeholder="Enter your first name" class="form-control"><br><br>
            
            <!-- LAST NAME INPUT -->
            <label><b>Enter your Last Name</b></label><br>
            <input type="text" id="lastname" placeholder="Enter your last name" class="form-control"><br><br>
            
            <div class="text-center">
                <input type="button" py-click="confirm_officer" class="btn btn-dark form-control" value="Confirm">
            </div>

        </div>

        <div class="container mt-5 p-5 bg-dark text-light text-center rounded-3 w-50" id="output">
        </div>


    </form>

    <div id="result"></div>
    
    <py-script src="main.py"></py-script>
    
</body>
</html>
